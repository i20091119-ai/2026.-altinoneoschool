<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>알티노 로봇 학교</title>
<style>
  @font-face{font-family:'Esamanru';src:url('fonts/esamanru-medium.woff2') format('woff2');font-weight:500;font-display:swap}
  @font-face{font-family:'Esamanru';src:url('fonts/esamanru-bold.woff2') format('woff2');font-weight:700;font-display:swap}
  :root{--ink:#3a3230;--mut:#9b8f86;--line:#f0e6d8;--blue:#5ea0ff;--mint:#37c9ad;--sun:#ffb23e;--coral:#ff7a86}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:'Esamanru',system-ui,sans-serif;font-weight:500;color:var(--ink);background:#fff7ea;
    height:100vh;overflow:hidden;padding:14px 20px;display:flex;flex-direction:column;gap:10px}
  h1{margin:0;font-size:1.6rem}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .top a{color:var(--blue);text-decoration:none}
  .bands{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .band{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
  .band h2{margin:0 0 4px;font-size:1.05rem}
  .app{display:block;text-decoration:none;color:inherit;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fffdf8}
  .app b{display:block;font-size:1.02rem}
  .app span{color:var(--mut);font-size:.82rem}
  .app.off{opacity:.45;pointer-events:none}
  .app.off span::after{content:' · 준비 중'}
  #team{color:var(--mut)}
  .toplinks{display:flex;gap:14px;align-items:center}
  .recbtn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px;font-family:inherit;font-size:1rem;color:var(--ink);cursor:pointer}
  /* 📒 성장기록부 — 이 태블릿에 쌓인 기록(altino.record)을 차시 순으로 */
  #recPop{position:fixed;inset:0;background:rgba(20,20,30,.5);display:flex;align-items:center;justify-content:center;z-index:50}
  #recPop.hidden{display:none}
  .recbox{background:#fff;border-radius:22px;width:min(920px,94vw);max-height:90vh;display:flex;flex-direction:column;padding:18px 22px;gap:10px;box-shadow:0 12px 40px rgba(120,90,50,.25)}
  .recbox h2{margin:0;font-size:1.3rem}
  .rechead{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .reclist{overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
  .recapp{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fffdf8}
  .recapp.none{opacity:.45}
  .recapp h3{margin:0 0 4px;font-size:1rem}
  .recapp h3 small{color:var(--mut);font-weight:500}
  .recrow{display:flex;gap:10px;align-items:baseline;font-size:.95rem;padding:2px 0}
  .recrow .st{min-width:4.2em;color:#e0a000}
  .recrow .dt{color:var(--mut);font-size:.8rem;margin-left:auto;white-space:nowrap}
  .recrow .de{color:var(--mut);font-size:.85rem}
</style>
</head>
<body>
  <div class="top">
    <h1>🏫 알티노 로봇 학교 <span id="team" style="font-size:1rem"></span></h1>
    <div class="toplinks"><button id="recOpen" class="recbtn">📒 성장기록부 보기</button><a href="home.html">체험관 홈 →</a></div>
  </div>
  <div id="recPop" class="hidden">
    <div class="recbox">
      <div class="rechead"><h2>📒 성장기록부 <small id="recSum" style="color:var(--mut);font-weight:500;font-size:.9rem"></small></h2><button id="recClose" class="recbtn">닫기</button></div>
      <p style="margin:0;color:var(--mut);font-size:.85rem">이 태블릿에서 해낸 일이에요. 같은 앱에서는 별이 늘 때만 한 줄 더 남아요.</p>
      <div class="reclist" id="recList"></div>
    </div>
  </div>
  <div class="bands" id="bands"></div>
  <script src="js/apps.js"></script>
  <script>
    (function () {
      var BANDS = [['입학하기', '🎒', '#5ea0ff'], ['기초반', '🌱', '#37c9ad'], ['교과반', '📚', '#ffb23e'], ['어울림반', '🎉', '#ff7a86']];
      var root = document.getElementById('bands');
      BANDS.forEach(function (b) {
        var col = document.createElement('div'); col.className = 'band';
        col.style.borderTop = '6px solid ' + b[2];
        col.innerHTML = '<h2>' + b[1] + ' ' + b[0] + '</h2>';
        (window.ALTINO_APPS || []).filter(function (a) { return a.band === b[0]; }).forEach(function (a) {
          var el = document.createElement('a');
          el.className = 'app' + (a.ready ? '' : ' off');
          el.href = a.id + '.html';
          el.innerHTML = '<b>' + a.title + '</b><span>' + a.id + ' · ' + a.lessons + '차시</span>';
          col.appendChild(el);
        });
        root.appendChild(col);
      });
      try { var t = localStorage.getItem('altino.team.name'); if (t) document.getElementById('team').textContent = '· 👥 ' + t; } catch (e) {}

      // 📒 성장기록부 보기 — kit.record 가 쓰는 'altino.record' 를 읽기만 한다
      var esc = function (x) { return String(x == null ? '' : x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
      function records() { try { var a = JSON.parse(localStorage.getItem('altino.record') || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
      function day(ms) { var d = new Date(ms); return isNaN(d) ? '' : (d.getMonth() + 1) + '/' + d.getDate(); }
      function renderRec() {
        var recs = records(), apps = window.ALTINO_APPS || [], html = '', has = 0, stars = 0;
        apps.forEach(function (a) {
          var mine = recs.filter(function (r) { return r && r.app === a.id; });
          if (mine.length) has++;
          html += '<div class="recapp' + (mine.length ? '' : ' none') + '" data-app="' + a.id + '"><h3>' + esc(a.title) + ' <small>' + a.id + ' · ' + a.lessons + '차시</small></h3>';
          if (!mine.length) html += '<div class="recrow"><span class="de">아직 기록 없음</span></div>';
          mine.forEach(function (r) {
            var s = Math.max(0, Math.min(3, r.stars | 0)); stars += s;
            html += '<div class="recrow"><span class="st">' + ('⭐'.repeat(s) || '·') + '</span><b>' + esc(r.title) + '</b><span class="de">' + esc(r.detail) + '</span><span class="dt">' + day(r.at) + '</span></div>';
          });
          html += '</div>';
        });
        document.getElementById('recList').innerHTML = html;
        document.getElementById('recSum').textContent = '— 기록한 앱 ' + has + ' / ' + apps.length + ' · 별 ' + stars + '개';
      }
      document.getElementById('recOpen').onclick = function () { renderRec(); document.getElementById('recPop').classList.remove('hidden'); };
      document.getElementById('recClose').onclick = function () { document.getElementById('recPop').classList.add('hidden'); };
      document.getElementById('recPop').onclick = function (e) { if (e.target.id === 'recPop') this.classList.add('hidden'); };
    })();
  </script>
</body>
</html>

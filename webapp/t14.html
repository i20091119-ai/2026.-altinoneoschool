<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>t14 보물 지도 탐험 — 알티노 로봇 학교</title>
<!--
  ═══════════════════════════════════════════════════════════════
  견본 앱 (t00) — 새 주제 앱은 이 두 파일을 복사해서 시작한다.
    t00.html → t07.html,  js/t00.js → js/t07.js   (번호만 바꾼다)
  ★ 표시 구역: 그대로 둔다(15개 앱 통일)   ✎ 표시 구역: 주제에 맞게 바꾼다
  안전 규칙은 js/kit.js 가 다 처리한다 — 앱에서 직접 setInterval 로 전송하거나
  localStorage 를 직접 쓰거나 confirm() 을 부르지 않는다. (docs/dev-guide/12)
  ═══════════════════════════════════════════════════════════════
-->
<style>
  /* ★ 공통 스타일 */
  @font-face{font-family:'Esamanru';src:url('fonts/esamanru-light.woff2') format('woff2');font-weight:300;font-display:swap}
  @font-face{font-family:'Esamanru';src:url('fonts/esamanru-medium.woff2') format('woff2');font-weight:500;font-display:swap}
  @font-face{font-family:'Esamanru';src:url('fonts/esamanru-bold.woff2') format('woff2');font-weight:700;font-display:swap}
  :root{--cream:#fff7ea;--ink:#3a3230;--mut:#9b8f86;--mint:#37c9ad;--sun:#ffb23e;--coral:#ff7a86;--blue:#5ea0ff;--grape:#b085ff;--line:#f0e6d8;--card:#fff;--shadow:0 8px 24px rgba(120,90,50,.12);--r:20px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:'Esamanru','Pretendard',system-ui,sans-serif;font-weight:500;color:var(--ink);
    background:linear-gradient(rgba(255,247,234,.55),rgba(255,247,234,.55)), url('assets/bg.png') center/cover no-repeat, var(--cream);
    height:100vh;overflow:hidden;user-select:none;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
  h1,h2,b{font-weight:700}
  .hidden{display:none !important}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .topbar a{color:var(--blue);text-decoration:none;font-size:1.05rem}
  .btn{border:0;border-radius:16px;font-family:inherit;font-size:1.05rem;padding:12px 18px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:var(--shadow)}
  .btn:active{transform:translateY(2px)}.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
  .btn.mint{background:var(--mint)}.btn.coral{background:var(--coral)}.btn.sun{background:var(--sun);color:#5a3200}.btn:disabled{opacity:.45}
  /* ⚠ 카드는 overflow:hidden. 조종 패드가 스크롤되는 상자 안에 있으면 버튼을 누른 채
       손가락이 조금만 움직여도 터치가 취소된다(정밀주차에서 실제로 난 버그). */
  .stage{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
    padding:12px 16px;overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:8px}
  .card h2{margin:0;font-size:1.05rem}
  .lead{color:var(--mut);font-size:.88rem;margin:0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  /* ★ 조종 패드 — kit.hold() 가 touch-action:none 과 포인터 캡처를 붙인다 */
  .pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:10px;width:100%;max-width:330px;margin:4px auto 0}
  .pad button{font-size:2rem;padding:20px 0;border-radius:18px;border:2px solid var(--line);background:#fff;box-shadow:var(--shadow);font-family:inherit}
  .pad button.pressed{background:var(--mint);color:#fff;transform:translateY(2px)}
  .pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
  .notes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .notes button{padding:10px 0;font-size:1rem}
  input[type=text]{font-family:inherit;font-size:1.05rem;padding:9px 12px;border-radius:12px;border:2px solid var(--line);width:150px}
  input[type=range]{width:100%}
  .modal{position:fixed;inset:0;background:rgba(20,20,30,.55);display:flex;align-items:center;justify-content:center;z-index:50}
  .sheet{background:#fff;border-radius:22px;padding:24px 28px;width:min(440px,92vw);text-align:center}
  /* ✎ t14 화면 */
  .steps{display:flex;gap:8px}
  .steps button{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 0;font-family:inherit;font-size:1.02rem;color:var(--mut);cursor:pointer}
  .steps button.on{background:var(--mint);border-color:var(--mint);color:#fff}
  .stage{grid-template-columns:1.12fr .88fr}
  .center{align-items:center;justify-content:center;text-align:center}
  .say{font-size:1.08rem;margin:0;min-height:1.4em}
  .mission{background:#fff9e0;border:2px solid var(--sun);border-radius:14px;padding:8px 12px;font-size:1.05rem}
  .missions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .missions button{min-width:104px;min-height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;font-family:inherit;font-size:1rem;cursor:pointer}
  .missions button.on{border-color:var(--blue);background:var(--blue);color:#fff}
  .missions button.done::after{content:' ✓';color:var(--mint)}
  .missions button.on.done::after{color:#fff}
  .segs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .segs span{border:3px solid;border-radius:12px;padding:4px 10px;font-size:.92rem;background:#fff}
  .segs span i{font-style:normal;color:var(--mut);font-size:.8rem}
  .s0{--sc:var(--blue);--sl:#eef5ff}.s1{--sc:var(--sun);--sl:#fff3d6}.s2{--sc:var(--grape);--sl:#f4edff}.s3{--sc:var(--coral);--sl:#fff0f2}
  .segs span{border-color:var(--sc)}
  .palette{display:flex;gap:10px;justify-content:center}
  .palette button{width:104px;height:80px;border-radius:18px;border:3px solid var(--line);background:#fff;font-family:inherit;font-size:.98rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:var(--shadow)}
  .palette button b{font-size:1.9rem;line-height:1}
  .palette button.flag{border-color:var(--coral)}
  .palette button:disabled{opacity:.4}
  .prog{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-content:center;min-height:68px;padding:8px;border:3px dashed var(--line);border-radius:16px;width:100%}
  .prog span{width:50px;height:54px;border-radius:12px;background:var(--sl);border:3px solid var(--sc);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.4rem;line-height:1}
  .prog span i{font-style:normal;font-size:.7rem;color:var(--mut)}
  .prog span.now{background:var(--mint);border-color:var(--mint);color:#fff}
  .prog span.now i{color:#fff}
  .prog .empty{color:var(--mut);align-self:center;font-size:1rem}
  .quiz{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
  .qtext{font-size:1.3rem;line-height:1.5;min-height:2.2em}
  .qnum{color:var(--mut);font-size:.95rem}
  .dirs{display:grid;grid-template-columns:repeat(3,92px);grid-template-rows:repeat(3,62px);gap:6px}
  .dirs button{border-radius:14px;border:3px solid var(--blue);background:#fff;font-family:inherit;font-size:1.25rem;color:var(--blue);cursor:pointer}
  .dirs button:disabled{opacity:.35}
  .dirs .dN{grid-column:2;grid-row:1}.dirs .dW{grid-column:1;grid-row:2}.dirs .dE{grid-column:3;grid-row:2}.dirs .dS{grid-column:2;grid-row:3}
  .dirs .mid{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center;font-size:1.8rem}
  .hints{display:flex;gap:12px;justify-content:center}
  .hints button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 10px;font-family:inherit;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:84px}
  .mini{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:56px;height:56px;padding:3px;border-radius:8px;background:#2d2a2e}
  .mini i{border-radius:50%;background:#4a4548}.mini i.on{background:#ff4040}
  .mapwrap{display:grid;grid-template-columns:22px auto 22px;grid-template-rows:20px auto 20px;align-items:center;justify-items:center;font-size:.95rem;color:var(--mut)}
  .mapwrap b{color:var(--coral)}
  .map{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:352px;height:352px}
  .map div{border-radius:10px;background:#fffdf8;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.7rem;line-height:1.05;position:relative;cursor:pointer}
  .map div small{font-size:.66rem;color:var(--ink)}
  .map div em{position:absolute;top:2px;right:4px;font-style:normal;font-size:.68rem;background:var(--coral);color:#fff;border-radius:8px;padding:1px 5px}
  .map div.stop{border:3px solid var(--coral)}
  .map div.path{background:var(--sl);border-color:var(--sc)}
  .map div.out{background:#fff0f2;border-color:var(--coral)}
  .map div.pick{outline:4px solid var(--mint)}
  .map div .bot{position:absolute;bottom:2px;left:4px;font-size:1rem}
  .judge{display:flex;gap:14px;justify-content:center}
  .judge button{width:96px;height:66px;font-size:2.2rem;border-radius:18px;border:4px solid var(--line);background:#fff;font-family:inherit;cursor:pointer}
  .judge #jO{border-color:var(--mint);color:var(--mint)}.judge #jX{border-color:var(--coral);color:var(--coral)}
  .cards{display:flex;gap:8px;justify-content:center;align-items:center}
  .cards span{width:76px;height:48px;border-radius:10px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--mut);background:#fff}
  .cards span.got{border:2px solid var(--sun);background:#fff3d6;color:var(--ink)}
  .dotnow{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.8rem;color:var(--mut)}
  .dotnow .mini{width:64px;height:64px}
  .stars{font-size:1.6rem;letter-spacing:4px}
  .tools{position:absolute;right:12px;bottom:10px;display:flex;gap:6px}
  .tools .btn{padding:6px 12px;font-size:.88rem}
  .cal{font-size:.9rem;color:var(--mut);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  .cal input{width:84px;font-family:inherit;font-size:1rem;padding:4px 8px;border-radius:10px;border:2px solid var(--line)}
</style>
</head>
<body>

<!-- ★ 상단바 -->
<div class="topbar">
  <div class="row">
    <a href="school.html">← 로봇학교</a>
    <h1 style="margin:0;font-size:1.25rem">🗺️ 보물 지도 탐험 <span class="lead" style="display:inline">27–28차시 · 지도와 방위 · 경유지 코딩 · 나누어 풀기</span></h1>
  </div>
  <div id="kitBar"></div>
</div>

<!-- ✎ 단계 표시 (05 §7) -->
<div class="steps" id="steps">
  <button data-step="1">① 지도 읽기</button>
  <button data-step="2">② 경유지 1곳</button>
  <button data-step="3">③ 탐험 시험</button>
</div>

<div class="stage">
  <section class="card center">
    <div class="mission" id="mission">지도를 읽어 봐요.</div>
    <div class="missions hidden" id="missions"></div>
    <div class="quiz" id="quizBox">
      <div class="qnum" id="qnum">문제 1 / 6</div>
      <div class="qtext" id="qtext"></div>
      <div class="dirs" id="dirs">
        <button class="dN" data-d="N">북 ↑</button><button class="dW" data-d="W">← 서</button>
        <div class="mid">🧭</div>
        <button class="dE" data-d="E">동 →</button><button class="dS" data-d="S">남 ↓</button>
      </div>
      <button id="quizAgain" class="btn ghost hidden">↺ 다시 풀기</button>
      <p class="lead">도트 힌트 그림 미리 보기 — 눌러서 알티노 도트에 띄워요</p>
      <div class="hints" id="hints"></div>
    </div>
    <div id="codeBox" class="hidden" style="display:flex;flex-direction:column;gap:8px;align-items:center;width:100%">
      <div class="segs" id="segs"></div>
      <div class="palette" id="palette"></div>
      <div class="prog" id="prog"></div>
      <div class="row" style="justify-content:center">
        <button id="undo" class="btn ghost">⌫ 하나 지우기</button>
        <button id="clear" class="btn ghost">모두 지우기</button>
        <button id="runBtn" class="btn mint">▶ 실행</button>
        <button id="stopBtn" class="btn coral hidden">■ 멈춰</button>
      </div>
    </div>
    <p class="say" id="say"></p>
  </section>
  <section class="card center" style="position:relative">
    <div class="dotnow hidden" id="dotNow"></div>
    <h2 id="mapTitle">🗺️ 보물 지도</h2>
    <div class="mapwrap">
      <span></span><b>북</b><span></span>
      <span>서</span><div class="map" id="map"></div><span>동</span>
      <span></span><span>남</span><span></span>
    </div>
    <p class="lead" id="mapLead"></p>
    <div id="judgeBox" class="hidden" style="display:flex;flex-direction:column;gap:6px;align-items:center">
      <p class="lead" style="margin:0;color:var(--ink)" id="jq"></p>
      <div class="judge"><button id="jO">⭕</button><button id="jX">❌</button></div>
    </div>
    <div class="cards hidden" id="cards"></div>
    <div class="stars" id="stars"></div>
    <div class="cal hidden" id="calBox">⚙ 선생님 보정 — 한 칸
      <input id="calF" type="number" inputmode="numeric" min="400" max="2000" step="50"> ms · 꺾기
      <input id="calT" type="number" inputmode="numeric" min="400" max="2500" step="50"> ms</div>
    <div class="tools"><button id="resetAll" class="btn ghost">처음부터</button><button id="calToggle" class="btn ghost">⚙ 보정</button></div>
  </section>
</div>

<!-- ★ 스크립트 순서 고정 -->
<script src="js/protocol.js"></script>
<script src="js/ui.js"></script>
<script src="js/dotmatrix.js"></script>
<script src="js/transport.js"></script>
<script src="js/kit.js"></script>
<script src="js/t14.js"></script>
</body>
</html>
